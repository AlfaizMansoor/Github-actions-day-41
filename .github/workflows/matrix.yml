name: matrix

on:
    workflow_dispatch:

jobs: 
    validate:
        runs-on: [ubuntu-latest, windows-latest]
        strategy:
            fail-fast: false
            matrix:
                python-versions: ["3.10", "3.11", "3.12"]
                exclude:
                    - os: windows-latest
                      python-version: ["3.10"]
        
        steps:
            - name: Checkout Code
              uses: actions/checkout@v4

            - name: Set up Python ${{ matrix.python-versions }}
              uses: actions/setup-python@v5
              with:
                python-version: ${{ matrix.python-versions }} 

            - name: install python
              run: |
                python --version
